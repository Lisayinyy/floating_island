<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lisa's floating island: an interactive personal world built with React Three Fiber. Every object on the island opens a chapter of Lisa's story."
    />
    <meta name="theme-color" content="#f6f2e8" />
    <meta name="color-scheme" content="light dark" />
    <title>Lisa World | A floating inner world</title>

    <!-- Fonts are self-hosted, and declared here rather than in src/index.css,
         for two reasons that both showed up in a waterfall.
         1. Google Fonts cost a DNS lookup, a TLS handshake and a stylesheet round
            trip before the first font byte. Worse, a pending stylesheet blocks
            script execution, so linking it in the head delayed this site's own JS
            by ~700ms and pushed first contentful paint to 3.0s.
         2. `base: './'` means Vite cannot rewrite `/fonts/...` references inside a
            bundled stylesheet, so a project-subpath deploy would 404 on them.
            Inline rules can use the same `./` the rest of the page uses.
         Six latin subsets, 84 kB total, same origin. All three families are
         OFL-licensed; see public/fonts/OFL.txt. -->
    <link
      rel="preload"
      href="./fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/shadows-into-light-two-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/instrument-serif-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/instrument-serif-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Shadows Into Light Two';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/shadows-into-light-two-400.woff2') format('woff2');
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lisa World | A floating inner world" />
    <meta
      property="og:description"
      content="An interactive floating island built with React Three Fiber. Every object opens a chapter of Lisa's story."
    />
    <meta property="og:url" content="https://lisayinyy.github.io/floating_island/" />
    <!-- Absolute URLs on purpose: Vite rewrites `src`/`href` for `base: './'` but
         not meta `content`, and most scrapers refuse to resolve a relative
         og:image anyway. The card itself is a screenshot of the real scene
         (`qa/share_card.py`), so it cannot drift from what visitors see. -->
    <meta
      property="og:image"
      content="https://lisayinyy.github.io/floating_island/share-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A low-poly floating island holding a cutaway cabin, a tree and a campfire, beside the words 'Welcome to Lisa's world'."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lisa World | A floating inner world" />
    <meta
      name="twitter:description"
      content="An interactive floating island built with React Three Fiber."
    />
    <meta
      name="twitter:image"
      content="https://lisayinyy.github.io/floating_island/share-card.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Resolve the theme before the bundle loads: a stored choice first, the
         operating-system preference second. Without this the first paint is
         always the light page, which flashes for night visitors. The key must
         match THEME_STORAGE_KEY in src/store/worldStore.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('floating-island:theme')
          var theme =
            stored === 'day' || stored === 'night'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'night'
                : 'day'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'night' ? '#101822' : '#f6f2e8')
        } catch (error) {
          document.documentElement.dataset.theme = 'day'
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
