<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisa’s Islands | An explorable project archipelago</title>
    <meta
      name="description"
      content="Explore Lisa’s growing 3D archipelago. Every island is a project, from AI tools to playful games."
    />
    <meta name="theme-color" content="#f3eef0" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lisa’s Islands | An explorable project archipelago" />
    <meta
      property="og:description"
      content="Explore Lisa’s growing 3D archipelago. Every island is a project, from AI tools to playful games."
    />
    <meta property="og:url" content="https://lisayinyy.github.io/floating_island/" />
    <meta
      property="og:image"
      content="https://lisayinyy.github.io/floating_island/share-card.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fonts are self-hosted and declared here rather than in the stylesheet:
      a pending <link rel=stylesheet> (or worse, an @import inside CSS) delays
      the page's own scripts, and Vite cannot rewrite public/ URLs found inside
      bundled CSS when base is './'.
    -->
    <link
      rel="preload"
      href="./fonts/instrument-serif-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/instrument-serif-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-600.woff2') format('woff2');
      }
    </style>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
