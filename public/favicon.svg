<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The island itself, not a letter: it is what the site is, and a chunky
    silhouette survives being drawn at 16px in a browser tab where a thin
    handwritten "L" would not.

    Two tones rather than one, because a single-colour version read as an
    arrowhead: the rose top plate is what makes it legible as ground with a mass
    hanging under it. Everything stays inside x 5-27 so nothing clips the rounded
    plate at large sizes. Palette matches the site — ink #34282f, rose #b95f7d.
  -->
  <rect width="32" height="32" rx="7.5" fill="#f4efe6" />
  <circle cx="20.5" cy="10.4" r="3" fill="#34282f" />
  <path d="M20.4 12.8 20.2 15.4" stroke="#34282f" stroke-width="1.4" stroke-linecap="round" />
  <path d="M5 16.2 27 16.2 22.5 22 16 27.6 9.5 21.8Z" fill="#34282f" />
  <path d="M5 16.2 10 14.2 22 14.2 27 16.2 22 18.2 10 18.2Z" fill="#b95f7d" />
</svg>
